name: Ограниченное обновление источников обложек

on:
  workflow_dispatch:
    inputs:
      ids:
        description: 'ID существующих image_unavailable без claim, через запятую (до 20)'
        required: true
        type: string
      recipient_public_key:
        description: 'Публичный PEM RSA ключ получателя (не менее 2048 бит)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: carousel-cover-source-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Получить проверяемый commit main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Подготовить Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Установить фиксированные зависимости
        run: python -m pip install --disable-pip-version-check 'httpx==0.28.1' 'cryptography==50.0.2'
      - name: Обновить источники и зашифровать результат в памяти
        run: python -m app.workers.carousel_cover_source_refresh
        env:
          PYTHONPATH: backend
          PYTHONDONTWRITEBYTECODE: '1'
          COVER_REFRESH_IDS: ${{ inputs.ids }}
          COVER_REFRESH_RECIPIENT_KEY: ${{ inputs.recipient_public_key }}
          META_IG_TOKEN: ${{ secrets.META_IG_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
      - name: Сохранить только зашифрованный результат на сутки
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: carousel-cover-source-refresh-${{ github.run_id }}
          path: ${{ runner.temp }}/carousel-cover-source-refresh/sealed.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
