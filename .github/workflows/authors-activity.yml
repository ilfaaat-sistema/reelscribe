name: Активность авторов Meta

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

concurrency:
  group: authors-activity-meta
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    permissions:
      contents: write
    steps:
      - name: Получить проверенный код
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Восстановить очередь
        run: python3 scripts/author_activity_store.py load --directory "$RUNNER_TEMP/authors-activity" --seed backend/data/authors-activity-seed
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Проверить, наступило ли время следующей порции
        id: gate
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          state = json.loads((Path(os.environ['RUNNER_TEMP']) / 'authors-activity/state.json').read_text())
          status = state.get('job_status', 'running')
          until = state.get('cooldown_until')
          waiting = bool(until and datetime.fromisoformat(until) > datetime.now(timezone.utc))
          blocked = status in ('authentication_required', 'permissions_or_request_error', 'failed')
          manual = os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch'
          run = status != 'finished' and not waiting and (not blocked or manual)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('should_run=' + str(run).lower() + '\n')
          print('Состояние:', status, '; обработка сейчас:', run)
          PY
      - name: Подготовить Python
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Установить только HTTP-клиент
        if: steps.gate.outputs.should_run == 'true'
        run: python -m pip install --disable-pip-version-check 'httpx==0.28.1'
      - name: Обработать следующую порцию без платных API
        if: steps.gate.outputs.should_run == 'true'
        working-directory: backend
        run: python -m app.workers.author_activity --checkpoint-dir "$RUNNER_TEMP/authors-activity" --output-report "$RUNNER_TEMP/authors-activity-report.json" --max-seconds 480 --max-requests 20
        env:
          META_IG_TOKEN: ${{ secrets.META_IG_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_IG_API_VERSION: v23.0
      - name: Сохранить прогресс и публичную статистику
        if: (success() || failure()) && steps.gate.outputs.should_run == 'true'
        run: |
          if [ -f "$RUNNER_TEMP/authors-activity-report.json" ]; then
            python scripts/author_activity_store.py save --directory "$RUNNER_TEMP/authors-activity" --report "$RUNNER_TEMP/authors-activity-report.json"
          else
            echo 'Отчёт не создан: прежняя серверная контрольная точка сохранена.'
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
