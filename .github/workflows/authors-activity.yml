name: Активность авторов Meta

on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: Длительность сессии до автоматической передачи очереди (1–330 минут)
        type: number
        default: 330
      retry_blocked:
        description: Повторить после устранения ошибки ключа или разрешений
        type: boolean
        default: false
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

concurrency:
  group: authors-activity-meta
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
      actions: write
    steps:
      - name: Получить проверенный код
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Подготовить Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Установить только HTTP-клиент
        run: python -m pip install --disable-pip-version-check 'httpx==0.28.1'
      - name: Продолжать сбор, ждать квоту и передать очередь следующему запуску
        run: python -m app.workers.author_activity_daemon --checkpoint-dir "$RUNNER_TEMP/authors-activity" --seed-dir backend/data/authors-activity-seed --output-report "$RUNNER_TEMP/authors-activity-report.json" --max-minutes "$SESSION_MINUTES" --retry-blocked "$RETRY_BLOCKED"
        env:
          PYTHONPATH: backend
          SESSION_MINUTES: ${{ inputs.session_minutes || '330' }}
          RETRY_BLOCKED: ${{ inputs.retry_blocked && 'true' || 'false' }}
          GH_TOKEN: ${{ github.token }}
          META_IG_TOKEN: ${{ secrets.META_IG_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_IG_API_VERSION: v23.0
