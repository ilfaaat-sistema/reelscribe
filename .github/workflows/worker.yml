name: worker

on:
  # Расписание вернулось 04.09.2026 (пауза с 10.08 снята): оплачены два новых токена Apify
  # по $5, и сервис должен доразбирать очередь без ноутбука владельца — ссылки заводятся
  # с телефона на https://reelscribe.vercel.app, дальше всё идёт само.
  #
  # Пятнадцать минут, а не пять: воркер работает в drain-режиме и на пустой очереди
  # завершается за минуту, но каждый лишний старт — это ещё и попытка достучаться до
  # исчерпанного APIFY_API_TOKEN, то есть впустую потраченный запрос. Минуты Actions при
  # этом бесплатны: репозиторий публичный.
  #
  # Основной путь запуска всё равно мгновенный — импорт через API дёргает repository_dispatch
  # (GITHUB_DISPATCH_TOKEN задан в переменных Vercel), расписание тут только страховка на
  # случай, если dispatch не дошёл.
  #
  # ВЫКЛЮЧЕНО 06.09.2026: очередь разобрана (812 расшифровок, 0 в ожидании), и расписание
  # начало крутить пустые прогоны каждые 15 минут. Новые ссылки заводятся с телефона —
  # импорт дёрнет воркер сам через repository_dispatch, расписание для этого не нужно.
  # ВКЛЮЧИТЬ обратно, когда снова копится большая очередь: раскомментировать две строки.
  # schedule:
  #   - cron: '*/15 * * * *'
  workflow_dispatch: {}
  repository_dispatch:
    types: [worker-run]

jobs:
  run:
    runs-on: ubuntu-latest
    # Жёсткий лимит GitHub Actions — 360 минут на джоб. Оставляем запас.
    timeout-minutes: 350

    # Несколько воркеров сразу: узкое место — распознавание на CPU (~38 c на рилс при
    # TRANSCRIBE_CONCURRENCY=2), и один раннер разбирал 120 рилсов около 80 минут.
    # Шарды не делят очередь по какому-либо признаку — claim заданий атомарный
    # (см. _claim_job в app/workers/run.py), поэтому воркеры просто разбирают общую
    # очередь наперегонки и одно задание дважды взято быть не может.
    # fail-fast: false — падение одного шарда не должно снимать остальные с работы.
    # ДВА шарда с 2026-08-19. Причина отката на один (10.08) устранена: кэш подписчиков и
    # cooldown ключей переехали из памяти процесса в общие таблицы followers_cache и
    # key_cooldown (коммит 9bcecba), поэтому воркеры больше не скрейпят профиль одного и
    # того же автора повторно и не упираются каждый по-своему в исчерпанный ключ.
    # Снова ОДИН шард (19.08, после замера). Причина уже не кэш подписчиков (он общий), а
    # цена профильного актора: sones/instagram-posts-scraper-lowcost тарифицируется
    # $0.005 за старт + $0.0003 за пост выдачи, при apify_profile_limit=120 это $0.041 за
    # вызов — замер на прогоне 32251076959: 29 вызовов, $1.045. Кэш списка постов
    # (_profile_cache в apify_profile_downloader) живёт в памяти процесса, поэтому второй
    # шард переплачивает на авторах, у которых в очереди больше одного рилса (в августовских
    # партиях 1.53 рилса на автора). Пока бюджет упирается в $5 за цикл, скорость не нужна.
    strategy:
      fail-fast: false
      matrix:
        shard: [1]

    # concurrency перенесён с уровня workflow на уровень job и разведён по шардам.
    # Иначе группа была бы общей на все четыре, и они выстроились бы в очередь друг
    # за другом вместо параллельной работы. Внутри своего шарда очередь сохраняется:
    # повторный запуск ждёт предыдущий, а не плодит дубли.
    # cancel-in-progress: false — принципиально. Если поставить true, новый запуск
    # (например мгновенный тригер из импорта) оборвёт раннер посреди распознавания,
    # и задание останется висеть в статусе in_progress до срабатывания _requeue_stale
    # (45 минут). Вместо отмены новые запуски просто встают в очередь за текущим.
    concurrency:
      group: reelscribe-worker-${{ matrix.shard }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements-worker.txt

      - name: Установка зависимостей
        working-directory: backend
        run: pip install -r requirements-worker.txt

      # Кэш моделей faster-whisper. Модели скачиваются через huggingface_hub
      # в ~/.cache/huggingface (обычный дефолт HF_HOME на Linux-раннере).
      # Ключ включает run_id, поэтому каждый запуск сохраняет свежий кэш заново,
      # а restore-keys без run_id подхватывает последний сохранённый по префиксу —
      # так кэш самообновляется, а не застревает навсегда на первом же сохранении.
      - name: Кэш моделей faster-whisper
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: fw-models-${{ github.run_id }}
          restore-keys: |
            fw-models-

      # Сколько токенов раннер реально видит и что у них с квотой — до разбора. Заведено
      # 04.09.2026: в тот день несколько часов ушло на вопрос «видит ли прогон Apify-токены и
      # тратит ли их», потому что ответить на него можно было только счётом вызовов в сыром
      # логе завершённого прогона. Датчик печатает порядковые номера и суммы; значения токенов
      # не печатаются никогда.
      # continue-on-error обязателен: это ДАТЧИК, он не имеет права останавливать разбор.
      # 04.09.2026 первый же прогон с этим шагом упал целиком — Settings требует
      # SUPABASE_URL/SUPABASE_ANON_KEY, а сюда они переданы не были, — и воркер даже не
      # стартовал. Диагностика, которая ломает то, что диагностирует, хуже её отсутствия.
      - name: Остаток квоты Apify (до разбора)
        continue-on-error: true
        working-directory: backend
        run: python -m app.workers.apify_quota
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          APIFY_API_TOKENS: ${{ secrets.APIFY_API_TOKENS }}

      - name: Запуск воркера (drain-режим)
        working-directory: backend
        run: python -m app.workers.run --drain
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          APIFY_API_TOKENS: ${{ secrets.APIFY_API_TOKENS }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          RAPIDAPI_KEYS: ${{ secrets.RAPIDAPI_KEYS }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          # OPENAI_API_KEY намеренно НЕ передаётся: без него asr_mode=faster-whisper физически
          # не может уйти в платное облачное распознавание, даже если код где-то попробует.
          # Одиночный актор первым источником (19.08.2026). Профильный при этом флаге
          # выключается: на очереди старых сохранённых рилсов он дал 0 попаданий из 31,
          # но списывал $0.041 за каждый промах. Одиночный берёт рилс по прямой ссылке за
          # $0.0027, подписчики добираются profile-scraper'ом по $0.0026 за автора.
          APIFY_SINGLE_PRIMARY: '1'
          ASR_MODE: faster-whisper
          AUDIO_TMP_DIR: /tmp/reelscribe_audio
          TRANSCRIBE_CONCURRENCY: '2'
          WORKER_DRAIN: '1'
          WORKER_MAX_RUNTIME_SEC: '20400'

      # Подписчиков одиночный актор не отдаёт (ownerFollowersCount всегда null), а без них не
      # считаются er/lpf/cpf. Раньше это был отдельный запуск с ноутбука владельца — теперь идёт
      # тем же прогоном. if: always() — добор нужен и тогда, когда воркер упёрся в свой таймаут:
      # расшифровки к этому моменту уже в базе, метрики к ним добираются независимо.
      - name: Добор подписчиков
        if: always()
        working-directory: backend
        run: python -m app.workers.backfill_followers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          APIFY_API_TOKENS: ${{ secrets.APIFY_API_TOKENS }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          RAPIDAPI_KEYS: ${{ secrets.RAPIDAPI_KEYS }}

      # Добивка переводов: часть готовых расшифровок на иностранных языках может остаться без
      # перевода (сбой перевода в моменте прогона, стадия добавлена позже к уже накопленным
      # записям и т.п.) — text_ru у них пуст, хотя text уже есть. Перевод бесплатный (Google
      # Translate без ключа, DeepL — по флагу), поэтому ключи ASR/Apify/RapidAPI сюда не нужны.
      # if: always() — так же, как у добора подписчиков: даже если основной воркер упёрся в свой
      # таймаут, уже готовые расшифровки в базе всё равно стоит довести до перевода.
      - name: Добивка переводов
        if: always()
        working-directory: backend
        run: python -m app.workers.backfill_translate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      # Та же строка после работы: разница с замером «до» и есть цена прогона в долларах.
      # Важно: /users/me/limits агрегируется с задержкой в несколько минут, поэтому свежий
      # расход тут может быть занижен — точные цифры смотреть в кабинете Apify.
      - name: Остаток квоты Apify (после разбора)
        if: always()
        continue-on-error: true
        working-directory: backend
        run: python -m app.workers.apify_quota
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          APIFY_API_TOKENS: ${{ secrets.APIFY_API_TOKENS }}

# Системный ffmpeg через apt намеренно не ставится: пакет imageio-ffmpeg (тянется зависимостями
# воркера) несёт собственный статический бинарник ffmpeg — проверено, работает без apt-пакета.
# Если ffmpeg вдруг не находится — ищи проблему не здесь, apt install тут не нужен.
