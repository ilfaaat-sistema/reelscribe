name: Карусели за 13–19 октября

on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: Длительность сессии до автоматической передачи очереди (1–330 минут)
        type: number
        default: 330
      pilot:
        description: Проверить первые несколько запросов перед массовым сбором
        type: boolean
        default: false
      start_full:
        description: Включить полный сбор после приёмки пилота
        type: boolean
        default: false
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

concurrency:
  group: carousels-week-meta
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
      actions: write
    steps:
      - name: Получить проверенный код
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Подготовить Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Установить только HTTP-клиент
        run: python -m pip install --disable-pip-version-check 'httpx==0.28.1'
      - name: Продолжать сбор, ждать квоту и передать очередь следующему запуску
        run: python -m app.workers.carousel_week --checkpoint-dir "$RUNNER_TEMP/carousels-week" --seed-dir backend/data/carousels-week-seed --output-report "$RUNNER_TEMP/carousels-week-report.json" --max-minutes "$SESSION_MINUTES" --pilot "$PILOT" --start-full "$START_FULL"
        env:
          PYTHONPATH: backend
          SESSION_MINUTES: ${{ inputs.session_minutes || '330' }}
          PILOT: ${{ inputs.pilot && 'true' || 'false' }}
          START_FULL: ${{ inputs.start_full && 'true' || 'false' }}
          GH_TOKEN: ${{ github.token }}
          META_IG_TOKEN: ${{ secrets.META_IG_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_IG_API_VERSION: v23.0
