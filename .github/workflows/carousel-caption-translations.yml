name: Массовый перевод подписей каруселей

on:
  workflow_dispatch:
    inputs:
      max_posts:
        description: Предел одного прохода (1–500)
        required: false
        type: number
        default: 500
  schedule:
    - cron: '4,19,34,49 * * * *'
  workflow_run:
    workflows: ['Живые избранные карусели']
    types: [completed]

permissions:
  contents: write
  actions: write

concurrency:
  group: carousel-caption-bulk
  cancel-in-progress: false

jobs:
  translate:
    if: >-
      vars.CAROUSEL_CAPTION_BULK_ENABLED == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Получить код main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Подготовить Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Установить фиксированный HTTP-клиент
        run: python -m pip install --disable-pip-version-check 'httpx==0.28.1'
      - name: Продолжить очередь перевода
        id: queue
        run: python -m app.workers.carousel_caption_bulk
        env:
          PYTHONPATH: backend
          GH_TOKEN: ${{ github.token }}
          CAROUSEL_CAPTION_BULK_ENABLED: ${{ vars.CAROUSEL_CAPTION_BULK_ENABLED }}
          CAROUSEL_CAPTION_BULK_MAX_POSTS: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.max_posts) || '500' }}
      - name: Передать незавершённую очередь следующему run
        if: steps.queue.outputs.needs_continuation == 'true'
        run: gh workflow run carousel-caption-translations.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
