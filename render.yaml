services:
  # ── API (FastAPI) ─────────────────────────────────────────────────────────
  - type: web
    name: reelscribe-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: starter          # 512 MB RAM, $7/мес — достаточно для API без Whisper
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: AUDIO_TMP_DIR
        value: /tmp/reelscribe_audio
      - key: WORKER_CONCURRENCY
        value: "2"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: FRONTEND_URL
        # значение задаётся в дашборде Render (sync: false — Blueprint его не перетирает).
        # поддерживается список доменов через запятую; боевой домен фронта — https://reelscribe-app.vercel.app
        sync: false
      - key: DEEPL_API_KEY
        sync: false                # опционально: free tier deepl.com/pro#developer

  # ── Worker (пайплайн: скачивание + ASR) ──────────────────────────────────
  - type: worker
    name: reelscribe-worker
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.workers.run
    plan: standard         # 2 GB RAM — запас для faster-whisper-фолбэка ($25/мес)
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      # источники Instagram — без них воркер не сможет скачивать
      - key: APIFY_API_TOKEN
        sync: false
      - key: RAPIDAPI_KEY
        sync: false
      - key: RAPIDAPI_KEYS
        sync: false                # несколько ключей через запятую — ротация при 429
      # ASR: auto → на Linux возьмёт cloud при наличии OPENAI_API_KEY, иначе faster-whisper CPU
      - key: ASR_MODE
        value: auto
      - key: OPENAI_API_KEY
        sync: false                # для облачной транскрипции (whisper-1)
      - key: DEEPL_API_KEY
        sync: false                # перевод на русский
      - key: AUDIO_TMP_DIR
        value: /tmp/reelscribe_audio
      - key: WORKER_CONCURRENCY
        value: "2"
      - key: PYTHON_VERSION
        value: "3.11.9"
