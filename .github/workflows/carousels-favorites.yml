name: Живые избранные карусели

on:
  workflow_dispatch:
  schedule:
    - cron: '3,18,33,48 * * * *'

permissions:
  contents: write
  actions: read

concurrency:
  group: carousels-favorites-meta
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Получить код
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Подготовить Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Установить HTTP-клиент
        run: python -m pip install --disable-pip-version-check 'httpx==0.28.1'
      - name: Собрать новые карусели избранных
        run: python -m app.workers.carousel_favorites
        env:
          PYTHONPATH: backend
          GH_TOKEN: ${{ github.token }}
          META_IG_TOKEN: ${{ secrets.META_IG_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_IG_API_VERSION: v23.0
